version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: subledger_postgres
    restart: always
    environment:
      POSTGRES_USER: subledger_user
      POSTGRES_PASSWORD: subledger_pass
      POSTGRES_DB: subledger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subledger_user -d subledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: subledger_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "SubLedger - SaaS Subscription & Billing System"
      DATABASE_URL: "postgresql://subledger_user:subledger_pass@db:5432/subledger_db"
      ENVIRONMENT: "production"

volumes:
  postgres_data:
